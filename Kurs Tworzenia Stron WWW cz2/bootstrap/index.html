<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:wght@500&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <h1>Hello, world!</h1>

    <div class="container">
        <div class="row">
            <!-- wynika to z tego że w bootstrapie jest podzielone na 12 elementów -->
            <div class="col-12 col-sm-6">1</div>
            <div class="col-4 col-sm-6">2</div>
            <div class="col-4 col-sm-6">3</div>
            <div class="col-4 col-sm-6">4</div>
        </div>
    </div>


    <!-- 
    <div class="container-md">
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. Provident.
    </div>
    <div class="container-fluid">Lorem ipsum dolor sit amet consectetur.</div> -->

    <br><br><br>

    <div class="container-fluid">
        <div class="row">
            <!-- wynika to z tego że w bootstrapie jest podzielone na 12 kolumn -->
            <div class="col-12">1</div>
            <div class="col-4">2</div>
            <div class="col-4">3</div>
            <div class="col-4">4</div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-12 col-sm-6 col-md-3 col-lg-4">1</div>
            <div class="col-12 col-sm-6 col-md-3 col-lg-4">2</div>
            <div class="col-12 col-sm-6 col-md-3 col-lg-4">3</div>
            <div class="col-12 col-sm-6 col-md-3 col-lg-4">4</div>
            <div class="col-12 col-sm-6 col-md-3 col-lg-4">5</div>
            <div class="col-12 col-sm-6 col-md-3 col-lg-4">6</div>
        </div>

    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
